# CI-скелет (Этап 0). Расширяется на последующих этапах (lint, golden).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -race project-wide: the digest worker-pool (internal/gitlog) is
        # genuinely concurrent, and the suite is small enough that the race
        # detector's overhead is negligible.
        run: go test -race ./...
